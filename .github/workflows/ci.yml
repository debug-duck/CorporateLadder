name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Headless tests + bot playthrough
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot (see tools/ci/godot_version.env)
        run: tools/ci/setup_godot.sh
      - name: Import project (headless)
        run: godot --headless --path . --import || godot --headless --path . --import
      - name: Unit / integration tests
        run: godot --headless --path . --fixed-fps 60 tests/run_tests.tscn
      - name: Bot playthrough (street -> CEO)
        run: godot --headless --path . --fixed-fps 60 tests/playthrough.tscn -- --runs=3
