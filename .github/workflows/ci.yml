name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Headless tests + bot playthrough
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot (see tools/ci/godot_version.env)
        run: tools/ci/setup_godot.sh
      - name: Import project (headless)
        run: godot --headless --path . --import || godot --headless --path . --import
      - name: Unit / integration tests
        run: godot --headless --path . --fixed-fps 60 tests/run_tests.tscn
      - name: Bot playthrough (street -> CEO)
        run: godot --headless --path . --fixed-fps 60 tests/playthrough.tscn -- --runs=3

  android-debug-apk:
    name: Build Android debug APK
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache Godot export templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ hashFiles('tools/ci/godot_version.env') }}
      - name: Install pinned Godot + export templates
        run: tools/ci/setup_godot.sh --templates
      - name: Android SDK components, debug keystore, editor settings
        run: tools/ci/android_setup.sh
      - name: Export debug APK
        run: tools/ci/build_apk.sh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: corporate-ladder-debug-apk
          path: build/corporate-ladder-debug.apk
          if-no-files-found: error
          retention-days: 3

  windows-build:
    name: Build Windows desktop exe
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot export templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ hashFiles('tools/ci/godot_version.env') }}
      - name: Install pinned Godot + export templates
        run: tools/ci/setup_godot.sh --templates
      - name: Export Windows exe
        run: |
          mkdir -p build/windows
          godot --headless --path . --import || godot --headless --path . --import
          godot --headless --path . --export-release "Windows" build/windows/CorporateLadder.exe
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: corporate-ladder-windows
          path: build/windows/
          if-no-files-found: error
          retention-days: 3
